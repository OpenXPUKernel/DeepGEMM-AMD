name: Backend compatibility contracts (CPU)

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  dispatch-and-build-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install CPU test dependencies
        run: python -m pip install pytest==9.1.1 setuptools==84.2.0 wheel==0.48.0 packaging==26.3
      - name: Check isolated backend selection (not hardware validation)
        run: python -m pytest -q tests/test_backend_dispatch.py tests/test_build_install.py tests/test_cdna4_benchmark.py tests/test_amd_benchmark_metrics.py
